name: Frontend type check

# frontend/ 의 .ts·.tsx 를 PR마다 타입체크한다.
#
# 이 워크플로가 없던 동안 프론트 타입 오류는 자동 검증이 0이었다 — backend-test.yml·
# ai-server-test.yml 은 paths 필터가 각자 backend/**·ai-server/** 라 걸리지 않는다.
# 그래서 프론트만 고친 PR 은 타입 오류가 있어도 체크 자체가 뜨지 않았다 (이슈 #327).
#
# 최소선으로 시작했다 — tsc --noEmit 만. ESLint 는 별건(package.json 에 lint 스크립트가 아직 없다).
#
# 2026-11-21: node 로 직접 도는 시험 둘을 같은 잡에 붙였다. 테스트 러너(jest 등)는 없지만 이미 있던
# 시험이 CI 밖에 있어서, 깨져도 아무도 몰랐다. 러너를 새로 들이는 대신 있는 것을 건다.
#   · lib/motion/run-tests.cjs        3D 운동 비교 라이브러리(DTW·분석·피드백) 34건
#   · services/transientFailure.test.cjs  재발급 실패가 «서버 일시 장애» 인지 가르는 판별 10건 (#890)
# 잡 이름(frontend typecheck)은 그대로다 — 이름을 바꾸면 이 이름을 필수 체크로 건 설정이 있을 때 깨진다.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'

# 같은 브랜치에 연속 푸시하면 이전 실행은 취소 — 러너 시간 낭비 방지
concurrency:
  group: frontend-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # tsconfig 가 expo/tsconfig.base 를 참조한다 — node_modules 없이 돌리면 그 참조를
      #못 찾아 오류 수백 개가 쏟아지는데 전부 가짜다(이슈 #327 재현 노트). npm ci 로
      # 실제 의존성을 깔아야 진짜 타입 오류만 남는다.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit -p .

      # 아래 둘은 typescript 를 require 훅으로 걸어 .ts 를 직접 읽는다(lib/motion/register.cjs) — 위 npm ci 로 깔린 것을 쓴다.
      # 실패하면 프로세스가 0 이 아닌 코드로 끝나 이 단계가 빨갛게 된다(두 스크립트 모두 실패 수에 따라 exit 한다).
      - name: node tests — 3D 운동 비교 라이브러리
        working-directory: frontend
        run: node lib/motion/run-tests.cjs

      - name: node tests — 재발급 일시 장애 판별
        working-directory: frontend
        run: node services/transientFailure.test.cjs

      - name: node tests — 서버 응답 캐시(신선도·무효화·세션 전환 시 비움)
        working-directory: frontend
        run: node lib/queryClient.test.cjs

      - name: node tests — 릴리스 빌드 설정 점검
        working-directory: frontend
        run: node scripts/check-release-env.test.cjs

      - name: node tests — 세션 자세 교정 이벤트 목록 표시
        working-directory: frontend
        run: node utils/feedbackEvents.test.cjs

      - name: node tests — 피드 리액션 낙관적 갱신
        working-directory: frontend
        run: node utils/reactions.test.cjs

      - name: node tests — 다음 세션 추천 카드 표시 문구
        working-directory: frontend
        run: node utils/nextSession.test.cjs

      - name: node tests — 기록 변경 신호 × 캐시 무효화
        working-directory: frontend
        run: node utils/recordsVersion.test.cjs

      - name: node tests — 측정 안 된 세션 안내 문구
        working-directory: frontend
        run: node utils/unmeasuredMessage.test.cjs

      # 화면·컴포넌트 단위 테스트 (jest-expo + React Native Testing Library). 위 node 테스트는 순수 로직이라
      # «이 버튼을 누르면 확인창이 뜨는가» 같은 화면 동작은 지금까지 검증이 없었다. 시범으로 운동 화면의
      # 뒤로가기 확인과 LoadError 가 걸려 있다(__tests__/, components/ui/__tests__/).
      - name: jest — 화면·컴포넌트
        working-directory: frontend
        run: npm test -- --ci
