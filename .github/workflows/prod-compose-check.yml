name: Prod compose check

# docker-compose.prod.yml 은 «상시 EC2 가 없어 돌려 본 적이 없다» 고 파일 머리말이 적고 있다 — 조용히 깨져도 아무도 모른다.
# `docker compose config` 로 해석만 한다(이미지를 받지 않고 컨테이너를 띄우지 않는다). 점검 내용은 scripts/ci/check_prod_compose.py 머리말:
#   필수 변수 가드가 살아 있는가 · 게시 포트가 허용 목록과 같은가(3306·9090·AI gRPC 노출 금지) · AI 채널 풀 = AI 워커 수 · 메모리/CPU 상한.
# 한계: 문법과 «경계» 만 본다. 이미지가 실제로 뜨는지, 앱이 서로 붙는지는 이 잡이 알 수 없다.

on:
  pull_request:
    paths:
      - 'docker-compose.prod.yml'
      - 'scripts/ci/check_prod_compose.py'
      - '.github/workflows/prod-compose-check.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.prod.yml'
      - 'scripts/ci/check_prod_compose.py'
      - '.github/workflows/prod-compose-check.yml'

concurrency:
  group: prod-compose-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: prod compose check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: docker compose version
        run: docker compose version

      - name: Check docker-compose.prod.yml
        run: python3 scripts/ci/check_prod_compose.py docker-compose.prod.yml
