# 반동기 미복귀 원인 분리 rig — 소스 1 + 리플리카 1 (로컬 전용)
#
# 08-17 rig(../replication-2026-08-17/docker-compose.yml)과 같은 설정이다. 바꾼 것은
# 컨테이너·네트워크 이름뿐 — 이 저장소에 세션이 둘 이상 붙어 08-17 rig 이 같은 이름으로
# 떠 있을 수 있어서 충돌을 피한다.
#
# 이 무대가 답하는 것은 «리플리카가 돌아왔을 때 반동기가 다시 붙는가» 라는 이진 사실뿐이다.
# 처리량·지연은 재지 않는다(같은 디스크·RTT ≈ 0).

services:
  source:
    image: mysql:8.0
    container_name: srec_source
    command:
      - --server-id=1
      - --log-bin=binlog
      - --binlog-format=ROW
      - --gtid-mode=OFF
      - --log-replica-updates=ON
      - --enforce-gtid-consistency=OFF
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
    environment:
      MYSQL_ROOT_PASSWORD: repl
      MYSQL_DATABASE: replprobe
    networks: [srec]

  replica:
    image: mysql:8.0
    container_name: srec_replica
    command:
      - --server-id=2
      - --log-bin=binlog
      - --binlog-format=ROW
      - --gtid-mode=OFF
      - --log-replica-updates=ON
      - --enforce-gtid-consistency=OFF
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --read-only=ON
    environment:
      MYSQL_ROOT_PASSWORD: repl
    networks: [srec]

networks:
  srec:
    name: srec_net
