# 4차 라운드(동시성 축) 전용 compose 오버레이 — 측정 조건 넷을 «라운드 동안만» 바꾼다.
# 설계: docs/decisions/grpc-webclient-concurrency-round.md §5-3
#
# 🔴 본 compose 를 안 고치는 이유 — 넷 다 배포 형상의 사실이고, 측정 편의로 형상을 영구히
#    바꾸면 안 된다(compose.ai-ab.yml 과 같은 원칙). rig 이 COMPOSE_FILE 로 이 파일을 얹고,
#    라운드가 끝나면 이 파일을 빼는 것만으로 원래 형상으로 돌아온다.
#
# 적용: COMPOSE_FILE=docker-compose.yml:loadtest/aws/compose.clientconc.yml docker compose up -d ...
#       (measure_ai_call_concurrency.sh 가 export 한다 — 손으로 띄울 때만 직접 준다)
services:
  shadowfit-ai:
    # ④ 검출기 풀 = 동시 활성 세션 상한이고, 풀은 컨테이너 메모리에서 유도된다
    #    (mediapipe_detector.py: 워커당 (한도/워커 − 708) / 106.74, 상수는 EC2 x86 실측 적합).
    #    client-ab 역할의 기본 2048m 이면 워커당 **1개** — c=4 에서 이미 재부착이 «풀 소진» 으로
    #    거절됐다(로컬 스모크). 거절은 success=false 라 타이머엔 성공으로 찍히므로 풀이 c 를
    #    넘어야 한다. c=32 → 세션은 session_id%3 으로 워커당 ≤11, 여유 1 → 워커당 12:
    #    3 × (708 + 12 × 106.74) = 5,967 MiB → 6000m. 공식은 저장소 것 그대로다(임의값 아님).
    #    로컬 스모크(c≤4)는 AI_CONC_MEM_LIMIT=2800m(워커당 2)으로 준다.
    mem_limit: ${AI_CONC_MEM_LIMIT:-6000m}
    environment:
      # ① gRPC 서버 스레드풀 상한. 배포 기본은 config.py 의 10 인데, REST 미러(FastAPI 동기
      #    엔드포인트)는 anyio 기본 40 이라 같은 프로세스 안에서 두 팔의 서버 상한이 4배 다르다.
      #    c > 10 에서 gRPC 팔만 서버 대기가 생기면 그건 클라이언트가 아니라 서버 설정 차이다 —
      #    라운드 동안만 같게 맞춘다. (그 비대칭 자체는 별도 기록 대상이고 여기서 안 고친다.)
      GRPC_MAX_WORKERS: ${GRPC_MAX_WORKERS:-40}
  shadowfit-backend:
    environment:
      # ③ 아웃박스 발행기 배치 크기. 배포 기본 20/틱(1s). 이 라운드는 칸당 stop 이 c 건뿐이라
      #    배수 시간 문제는 작지만, 2·3차와 「발행기 설정이 다르다」는 조건으로 기록한다.
      #    발행기가 1건씩 순차인 것은 그대로라 호출당 지연 자체는 안 바뀐다(설계 §3-3).
      OUTBOX_PUBLISHER_BATCH_SIZE: ${OUTBOX_PUBLISHER_BATCH_SIZE:-200}
      # ⑤ access 토큰 수명. 배포 기본 1800s(30분, 이슈 #137)인데 라운드는 2시간이라 32분째
      #    칸에서 드라이버의 요청이 전부 401 로 죽었다(로컬 스모크). 값은 phase 타임아웃(4h)과
      #    같게 — 측정 구간(Spring→AI)과 무관한 자리다.
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-14400}
