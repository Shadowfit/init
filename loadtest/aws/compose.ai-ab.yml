# gRPC vs WebClient A/B (ROLE=ai-ab) 전용 compose 오버레이.
# 설계: docs/decisions/grpc-webclient-empirical-comparison.md §9.3
#
# 왜 오버레이가 필요한가 — 본 compose 의 shadowfit-ai 는 gRPC(8585-8587)와 워커 HTTP
# (8000-8002)를 `expose` 로만 둔다. 호스트로 나가는 건 ai-nginx(8000)뿐이다. 그건 운영
# 의도로 맞다(gRPC 는 Spring 만 같은 도커 네트워크에서 부른다) — 하지만 이 라운드는
# **부하기가 다른 박스**라 세 팔이 전부 호스트 포트를 통해야 한다.
#
# 🔴 그래서 이 파일은 «측정용 개방» 이다. 본 compose 를 고치지 않는 이유가 이것이다 —
#    고치면 운영 형상이 측정 편의 때문에 영구히 바뀐다. 라운드가 끝나면 이 파일을 빼는
#    것만으로 원래 형상으로 돌아온다.
#
# ⚠️ 보안: 8585 와 18000 은 INTERNAL_API_TOKEN 을 요구하는 표면이다. 이 오버레이를 쓰는
#    인스턴스의 보안그룹은 **부하기 인스턴스 하나만** 허용해야 한다. 0.0.0.0/0 으로 열면
#    #134/#230 이 지킨 경계가 «네트워크 계층에서» 무너진다.
services:
  shadowfit-ai:
    ports:
      # 워커 0 의 gRPC — grpc 팔이 여기를 친다. 8586/8587(워커 1·2)은 일부러 안 연다:
      # 이 rig 는 전 팔을 워커 0 에 고정하므로 열어봐야 안 쓰고, 표면만 넓어진다.
      - "8585:8585"
      # 워커 0 의 HTTP — rest-direct 팔(= nginx 홉을 뺀 것)이 여기를 친다.
      # 호스트 8000 은 ai-nginx 가 이미 쓰므로 18000 으로 옮겨 붙인다.
      - "18000:8000"
