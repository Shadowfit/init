# 5차 라운드(네이티브 REST 팔) 동안만 ai-nginx 에 얹는 본문 버퍼 설정 — compose.clientconc.yml 이
# conf.d/zz-body-buffer.conf 로 마운트한다(http 컨텍스트, default.conf 의 server 가 상속).
# 설계: docs/decisions/grpc-webclient-native-rest-round.md §5-3 ⑧
#
# 왜: 4차 액세스 로그 31,388건 전부에서 Spring→AI 재부착 본문(req_len 114,223 B)이 nginx 기본
#     버퍼(x86-64 에서 16k)를 넘어 요청마다 디스크 임시파일로 갔다(#730). 그 디스크 I/O 는 REST
#     팔에만 붙는 대가인데 «전송 형식» 이 아니라 «nginx 기본값» 의 대가다 — 라운드 동안 뺀다.
# 값: 4차 실측 본문 114,223 B 보다 큰 2의 거듭제곱 중 가장 작은 것 = 128k(131,072 B). nested 팔은
#     이스케이프가 빠져 이보다 작다. 게이트(measure_ai_call_concurrency.sh)가 라운드 동안 nginx
#     경고 «a client request body is buffered to a temporary file» 가 0건인지로 확인한다 —
#     값이 모자라면 거기서 멈춘다.
# 🔴 배포 형상엔 안 넣는다 — #730 의 프로덕션 처리는 그 이슈에서 따로 결정한다.
client_body_buffer_size 128k;
