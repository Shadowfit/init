# #276 ㄷ(자연키 PK) 비용 측정 rig — MySQL 1 + 클라이언트 1
#
# 설계: docs/decisions/r276-lock-root-cause-fix.md §5
# 버퍼풀은 시작 인자라(SET GLOBAL 은 chunk×instances 단위로만 들어서 작은 값이 조용히 무시된다 —
# measure_uk_bufferpool.sh 08-23 실측) POOL_MB 를 바꾸면 컨테이너를 다시 만든다. 데이터는 이름 붙은
# 볼륨에 있어 다시 만들어도 남는다.
#
# 이름이 natpk_* 라 앱 스택(shadowfit-*)·다른 rig 과 안 겹친다.

services:
  mysql:
    image: mysql:8.0
    container_name: natpk_mysql
    command:
      - --innodb-buffer-pool-size=${POOL_MB:-2048}M
      - --innodb-buffer-pool-chunk-size=32M
      - --innodb-buffer-pool-instances=1
      # 재기동하면 버퍼풀이 비어 있어야 한다 — 8.0 기본값은 내릴 때 덤프·올릴 때 다시 읽기라 «차가운» 판이 안 된다
      - --innodb-buffer-pool-dump-at-shutdown=OFF
      - --innodb-buffer-pool-load-at-startup=OFF
      # 온라인 DDL 도중 쓰기를 모아두는 한도. 기본값(128MB) 그대로가 기본 — 11-08 라운드는 이 한도가 차서 팔 N 이
      # 매판 1799 로 실패했다. 재측정 라운드만 ONLINE_LOG_BYTES 로 올린다(값의 근거는 launch.sh)
      - --innodb-online-alter-log-max-size=${ONLINE_LOG_BYTES:-134217728}
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --log-bin=binlog
      - --binlog-format=ROW
      - --max-connections=500
      - --innodb-monitor-enable=index_page_splits,index_page_merge_successful,index_page_reorg_successful
      # pt-osc(Perl DBD::mysql)가 caching_sha2 를 비SSL 로 못 읽는다(online-ddl _rig.sh) — 이 rig 한정
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: natpk
      MYSQL_DATABASE: natpk
    volumes:
      - natpk_data:/var/lib/mysql
    networks: [natpk]

  client:
    image: python:3.12-slim
    container_name: natpk_client
    command: ["sh", "-c", "pip install -q --disable-pip-version-check pymysql==1.1.1 && touch /tmp/ready && sleep infinity"]
    environment:
      NATPK_HOST: natpk_mysql
    volumes:
      - ./natpk.py:/work/natpk.py:ro
      - ./_work:/work/out
    networks: [natpk]

volumes:
  natpk_data:
    name: natpk_data

networks:
  natpk:
    name: natpk_net
